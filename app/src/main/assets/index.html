const clean=h=>window.DOMPurify?DOMPurify.sanitize(h):esc(h);

/* splash */
(function(){const s=$('splash'),pf=$('pf');let done=false;const t0=performance.now();
 function out(){if(done)return;done=true;s.classList.add('out');setTimeout(()=>s.remove(),600)}
 s.onclick=out;
 (function f(now){const p=Math.min(1,(now-t0)/1400);pf.style.width=(p*100)+'%';if(p<1)requestAnimationFrame(f);else if(document.readyState==='complete')setTimeout(out,150);else addEventListener('load',()=>setTimeout(out,150))})(t0);
})();

/* IndexedDB library */
function db(){return new Promise((res,rej)=>{try{const r=indexedDB.open('omni-reader',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idb(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('f',mode);const r=fn(t.objectStore('f'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}
async function saveLib(f){try{await idb('readwrite',s=>s.put({id:f.name+'|'+f.size,name:f.name,size:f.size,type:f.type,added:Date.now(),blob:f}));}catch(e){}}
async function libList(){try{return((await idb('readonly',s=>s.getAll()))||[]).sort((a,b)=>b.added-a.added)}catch(e){return[]}}

const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
async function openLib(id){const r=await idb('readonly',s=>s.get(id));if(r)load(new File([r.blob],r.name,{type:r.type}),true)}
async function recent(){const l=(await libList()).slice(0,4),el=$('recent');el.innerHTML=l.length?'<div class="rl">Recently opened</div>'+l.map(x=>`<button data-id="${esc(x.id)}"><div class="ic">${esc((x.name.split('.').pop()||'').slice(0,4))}</div><span>${esc(x.name)}</span></button>`).join(''):'';el.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();openLib(b.dataset.id)})}
async function drawPanel(){recent();
  const p=$('panel');document.querySelectorAll('.stabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===ptab));
  if(ptab==='lib'){const l=await libList();
    p.innerHTML=l.length?l.map(x=>`<div class="it" data-id="${esc(x.id)}"><div class="ic">${esc((x.name.split('.').pop()||'').slice(0,4))}</div><div style="min-width:0"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px">${esc(x.name)}</div><small>${kb(x.size)} · ${new Date(x.added).toLocaleDateString()}</small></div><span class="x" data-del="1">✕</span></div>`).join(''):'<div class="empty">Files you open are kept here on this device so you can reopen them quickly.</div>';
    p.querySelectorAll('.it').forEach(el=>el.onclick=async e=>{const id=el.dataset.id;
      if(e.target.dataset.del){await idb('readwrite',s=>s.delete(id));drawPanel();return}
      const r=await idb('readonly',s=>s.get(id));if(r){const f=new File([r.blob],r.name,{type:r.type});load(f,true)}});}
  else if(ptab==='out')await drawOutline();
}
async function drawOutline(){
  const p=$('panel'),d=docs[cur];if(!d){p.innerHTML='<div class="empty">Open a document to see its outline.</div>';return}
  let h='';const bms=ls.get('bm:'+d.name,[]);
  if(bms.length)h+='<div style="font-size:11px;color:var(--mute);padding:2px 9px">BOOKMARKS</div>'+bms.map((b,i)=>`<div class="it" data-bm="${i}">★ ${esc(b.label)}<span class="x" data-rm="${i}">✕</span></div>`).join('')+'<hr style="border:0;border-top:1px solid var(--line)">';
  let items=[];
  if(d.kind==='pdf'){try{const o=await d.pdf.getOutline();const walk=async(a,lv)=>{for(const i of a||[]){let pg=null;try{let de=i.dest;if(typeof de==='string')de=await d.pdf.getDestination(de);if(de)pg=(await d.pdf.getPageIndex(de[0]))+1}catch(e){}items.push({t:i.title,lv,pg});await walk(i.items,Math.min(lv+1,4))}};await walk(o,1)}catch(e){}}
  else if(d.kind==='html'){$('view').querySelectorAll('h1,h2,h3,h4').forEach((e,i)=>{e.id='h'+i;items.push({t:e.textContent,lv:+e.tagName[1],id:e.id})})}
  h+=items.length?items.map(i=>`<div class="it h${i.lv}" data-pg="${i.pg||''}" data-id="${i.id||''}">${esc(i.t)}</div>`).join(''):'<div class="empty">No headings found in this document.</div>';
  p.innerHTML=h;
  p.querySelectorAll('[data-pg],[data-id]').forEach(e=>e.onclick=()=>{if(e.dataset.pg)jump(+e.dataset.pg);else if(e.dataset.id)$(e.dataset.id)?.scrollIntoView({behavior:'smooth'})});
  p.querySelectorAll('[data-bm]').forEach(e=>e.onclick=ev=>{const i=+e.dataset.bm;if(ev.target.dataset.rm){bms.splice(i,1);ls.set('bm:'+d.name,bms);drawOutline();return}goPos(bms[i])});
}
function goPos(b){const d=docs[cur];if(b.pg)jump(b.pg);else $('main').scrollTo({top:b.top*($('main').scrollHeight-$('main').clientHeight),behavior:'smooth'})}

/* loading */
async function load(f,fromLib){
  const ex=docs.findIndex(d=>d.name===f.name&&d.size===f.size);if(ex>=0){show(ex);return}
  $('load').classList.add('on');$('lt').textContent='Opening '+f.name+'…';
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  const d={name:f.name,size:f.size,ext,kind:'html',html:'',zoom:1,page:1,fit:innerWidth<=760};
  try{
    if(ext==='pdf'){d.kind='pdf';d.pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;}
    else if(ext==='docx'){const r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()});d.html='<div class="doc">'+clean(r.value)+'</div>';}
    else if(['xlsx','xls'].includes(ext)){const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      d.html='<div class="doc">'+wb.SheetNames.map(n=>'<h2>'+esc(n)+'</h2>'+clean(XLSX.utils.sheet_to_html(wb.Sheets[n]).replace(/<\/?(html|body|head)[^>]*>/g,''))).join('')+'</div>';}
    else if(['md','markdown'].includes(ext)){d.html='<div class="doc">'+clean(marked.parse(await f.text()))+'</div>';}
    else if(['csv','tsv'].includes(ext)){const wb=XLSX.read(await f.text(),{type:'string',FS:ext==='tsv'?'\t':undefined});
      d.html='<div class="doc">'+clean(XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[0]]).replace(/<\/?(html|body|head)[^>]*>/g,''))+'</div>';}
    else if(['html','htm'].includes(ext)){d.html='<div class="doc">'+clean(await f.text())+'</div>';}
    else if(ext==='json'){const t=await f.text();let p=t;try{p=JSON.stringify(JSON.parse(t),null,2)}catch(e){}d.html='<div class="doc"><pre>'+esc(p)+'</pre></div>';}
    else if(f.type.startsWith('image/')){d.kind='img';d.url=URL.createObjectURL(f);}
    else if(f.type.startsWith('text/')||['txt','log','xml','ini','cfg','yml','yaml'].includes(ext)){d.html='<div class="doc"><pre>'+esc(await f.text())+'</pre></div>';}
    else throw new Error(ext==='doc'?'Old .doc files aren’t supported. Save it as .docx first.':'This file type isn’t supported yet.');
  }catch(e){d.html='<div class="doc">Couldn’t open this file: '+esc(e.message||e)+'</div>';d.kind='html';}
  $('load').classList.remove('on');
  docs.push(d);if(!fromLib)saveLib(f);show(docs.length-1);
}

function tagHeadings(){$('view').querySelectorAll('h1,h2,h3,h4').forEach((e,i)=>e.id='h'+i)}
function closeTab(i){const d=docs[i];if(d){try{d.pdf&&d.pdf.destroy()}catch(e){}d.url&&URL.revokeObjectURL(d.url)}
  const was=i===cur;docs.splice(i,1);if(!docs.length)return show(-1);if(was)show(Math.min(i,docs.length-1));else{if(i<cur)cur--;tabs()}}
function tabs(){const t=$('tabs');t.innerHTML='';document.body.classList.toggle('multi',docs.length>1);
  docs.forEach((d,i)=>{const e=document.createElement('div');e.className='tab'+(i===cur?' on':'');e.innerHTML='<span>'+esc(d.name)+'</span><b title="Close">✕</b>';
    e.onclick=ev=>{ev.target.tagName==='B'?closeTab(i):show(i)};t.appendChild(e)});}

async function show(i){
  window.speechSynthesis&&speechSynthesis.cancel();speaking=false;$('tts').classList.remove('on');
  cur=i;tabs();marks=[];mi=-1;$('cnt').textContent='';document.body.classList.remove('hits');$('prog').style.width='0';
  const v=$('view');v.innerHTML='';v.style.zoom='';v.style.transform='';v.style.maxWidth='';v.classList.remove('pdf');
  document.body.classList.toggle('hasdoc',i>=0);
  if(i<0){$('drop').style.display='';$('s1').textContent='Ready';$('s2').textContent='';drawPanel();return}
  $('drop').style.display='none';const d=docs[i];$('dock').dataset.k=d.kind;$('zl').textContent=Math.round(d.zoom*100)+'%';$('fw').classList.toggle('on',!!d.fit);
  const pos=ls.get('pos:'+d.name,null);
  if(d.kind==='pdf'){if(pos&&pos.pg)d.page=pos.pg;$('pt').textContent='/ '+d.pdf.numPages;$('pn').max=d.pdf.numPages;$('pn').value=d.page;$('s1').textContent=d.pdf.numPages+' pages';$('s2').textContent='';await renderPdf(d)}
  else if(d.kind==='img'){v.innerHTML='<div class="imgv"><img src="'+d.url+'" alt=""></div>';applyImg(d);$('s1').textContent='Image';$('s2').textContent=''}
  else{v.innerHTML=d.html;tagHeadings();v.style.zoom=d.zoom;const w=(v.innerText.match(/\S+/g)||[]).length;$('s1').textContent=w.toLocaleString()+' words';$('s2').textContent='≈ '+Math.max(1,Math.round(w/230))+' min read';
    if(pos&&pos.top)requestAnimationFrame(()=>$('main').scrollTo({top:pos.top*($('main').scrollHeight-$('main').clientHeight)}))}
  if(docs[cur]!==d)return;
  if(ptab==='out')drawOutline();else if(ptab==='lib')drawPanel();
  if($('q').value)search();
}

const MAXPX=innerWidth<=760?8e6:16e6;
const pdfSc0=d=>d.fit?Math.min(1100,$('main').clientWidth-(innerWidth<=760?20:44))/d.bw:1.3;
const sizePages=d=>{const w=d.bw*d.sc0*d.zoom+'px';$('view').querySelectorAll('canvas').forEach(c=>c.style.width=w)};
async function renderPdf(d){
  const v=$('view'),tok=d.tok=(d.tok||0)+1;if(io)io.disconnect();
  const p1=await d.pdf.getPage(1);if(d.tok!==tok||docs[cur]!==d)return;
  const b0=p1.getViewport({scale:1});d.bw=b0.width;d.bh=b0.height;d.sc0=pdfSc0(d);
  v.innerHTML='';v.style.maxWidth='none';v.classList.add('pdf');
  for(let n=1;n<=d.pdf.numPages;n++){const c=document.createElement('canvas');c.className='page';c.dataset.p=n;c.width=10;c.height=10;c.style.aspectRatio=d.bw+'/'+d.bh;v.appendChild(c)}
  sizePages(d);observePages(d);
  setTimeout(()=>{if(d.tok===tok)jump(d.page,true)},50);
}
function observePages(d){if(io)io.disconnect();const tok=d.tok;
  io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)paint(d,en.target,tok)}),{root:$('main'),rootMargin:'700px 0px'});
  $('view').querySelectorAll('canvas').forEach(c=>{delete c.dataset.key;io.observe(c)})}
async function paint(d,c,tok){
  const want=d.sc0*d.zoom,dpr=Math.min(devicePixelRatio||1,2),key=want.toFixed(3)+'|'+dpr;
  if(c.dataset.key===key||d.tok!==tok)return;c.dataset.key=key;
  const p=await d.pdf.getPage(+c.dataset.p);if(docs[cur]!==d||c.dataset.key!==key)return;
  const v0=p.getViewport({scale:1});let s=want*dpr;const px=v0.width*s*v0.height*s;if(px>MAXPX)s*=Math.sqrt(MAXPX/px);
  const vp=p.getViewport({scale:s}),tmp=document.createElement('canvas');tmp.width=Math.ceil(vp.width);tmp.height=Math.ceil(vp.height);
  await p.render({canvasContext:tmp.getContext('2d'),viewport:vp}).promise;
  if(docs[cur]!==d||c.dataset.key!==key)return;
  if(Math.abs(v0.width/v0.height-d.bw/d.bh)>.01)c.style.aspectRatio=v0.width+'/'+v0.height;
  c.width=tmp.width;c.height=tmp.height;c.getContext('2d').drawImage(tmp,0,0);c.dataset.done=1;
}
function jump(n,q){const d=docs[cur];if(!d||d.kind!=='pdf')return;n=Math.max(1,Math.min(d.pdf.numPages,n||1));d.page=n;$('pn').value=n;
  const c=$('view').querySelector('[data-p="'+n+'"]');if(c)$('main').scrollTo({top:c.offsetTop-10,behavior:q?'auto':'smooth'})}

/* zoom: only the document is scaled, never the app chrome. The point under the fingers/cursor stays put. */
let zt;
function applyImg(d){const im=$('view').querySelector('img');if(!im)return;const go=()=>{const cw=$('main').clientWidth-(innerWidth<=760?20:44);im.style.maxWidth='none';im.style.width=Math.min(im.naturalWidth||cw,cw)*d.zoom+'px'};im.complete?go():im.onload=go}
function setZoom(z,cx,cy){const d=docs[cur];if(!d||(d.kind==='pdf'&&!d.bw))return;const m=$('main');
  z=Math.max(.5,Math.min(4,Math.round(z*1000)/1000));const old=d.zoom;if(z===old)return;
  if(cx==null){cx=m.clientWidth/2;cy=m.clientHeight/2}
  const pad=parseFloat(getComputedStyle(m).paddingTop)||0,r=z/old,px=m.scrollLeft+cx,py=m.scrollTop+cy,frac=py/Math.max(1,m.scrollHeight);
  d.zoom=z;$('zl').textContent=Math.round(z*100)+'%';
  if(d.kind==='pdf'){sizePages(d);clearTimeout(zt);zt=setTimeout(()=>observePages(d),220)}
  else if(d.kind==='img')applyImg(d);
  else $('view').style.zoom=z;
  m.scrollLeft=(px-pad)*r+pad-cx;
  m.scrollTop=(d.kind==='html'?frac*m.scrollHeight:(py-pad)*r+pad)-(d.kind==='html'?cy:cy);
}
const zoomBy=(f,cx,cy)=>{const d=docs[cur];if(d)setZoom(d.zoom*f,cx,cy)};

/* search */
async function pdfText(d,n){d.texts=d.texts||{};if(d.texts[n]==null){const p=await d.pdf.getPage(n);d.texts[n]=(await p.getTextContent()).items.map(i=>i.str).join(' ')}return d.texts[n]}
async function search(){
  const d=docs[cur];if(!d)return;const q=$('q').value.trim();
  if(d.kind==='pdf'){if(!q){$('cnt').textContent='';if(ptab==='res')$('panel').innerHTML='<div class="empty">Type to search this PDF.</div>';return}
    ptab='res';$('side').classList.remove('hide');const p=$('panel');document.querySelectorAll('.stabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='res'));
    p.innerHTML='<div class="empty">Searching…</div>';const re=new RegExp(rx(q),'gi');let out='',tot=0;const my=d.sk=(d.sk||0)+1;
    for(let n=1;n<=d.pdf.numPages;n++){if(d.sk!==my)return;const t=await pdfText(d,n);let m,k=0;re.lastIndex=0;
      while((m=re.exec(t))&&k<4){k++;tot++;const a=Math.max(0,m.index-30),s=esc(t.slice(a,m.index))+'<mark>'+esc(m[0])+'</mark>'+esc(t.slice(m.index+m[0].length,m.index+m[0].length+40));out+=`<div class="it" data-pg="${n}"><div><small>Page ${n}</small>…${s}…</div></div>`}}
    p.innerHTML=out||'<div class="empty">No matches.</div>';$('cnt').textContent=tot+' found';p.querySelectorAll('[data-pg]').forEach(e=>e.onclick=()=>jump(+e.dataset.pg));return}
  if(d.kind!=='html')return;
  const v=$('view');v.innerHTML=d.html;tagHeadings();marks=[];mi=-1;if(!q){$('cnt').textContent='';return}
  const re=new RegExp(rx(q),'gi'),w=document.createTreeWalker(v,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{if(!re.test(n.nodeValue))return;re.lastIndex=0;const s=document.createElement('span');s.innerHTML=esc(n.nodeValue).replace(new RegExp(rx(esc(q)),'gi'),m=>'<mark>'+m+'</mark>');n.replaceWith(s)});
  marks=[...v.querySelectorAll('mark')];$('cnt').textContent=marks.length+' found';document.body.classList.toggle('hits',marks.length>0);if(marks.length)step(1);
}
function step(dir){if(!marks.length)return;if(mi>=0)marks[mi].classList.remove('cur');mi=(mi+dir+marks.length)%marks.length;marks[mi].classList.add('cur');marks[mi].scrollIntoView({block:'center'});$('cnt').textContent=(mi+1)+' / '+marks.length}

/* text helpers */
async function curText(){const d=docs[cur];if(!d)return'';if(d.kind==='pdf')return pdfText(d,d.page);if(d.kind==='html')return $('view').innerText;return''}

$('theme').onclick=()=>{ti=(ti+1)%3;document.documentElement.dataset.theme=themes[ti];ls.set('theme',themes[ti]);toast('Theme: '+themes[ti])};
{const s=ls.get('theme','dark');ti=Math.max(0,themes.indexOf(s));document.documentElement.dataset.theme=themes[ti]}

$('tts').onclick=async()=>{if(!window.speechSynthesis)return toast('Read aloud isn’t supported here');
  if(speaking){speechSynthesis.cancel();speaking=false;$('tts').classList.remove('on');return}
  const t=(await curText()).replace(/\s+/g,' ').trim();if(!t)return toast('Nothing to read');
  const parts=t.match(/[^.!?]+[.!?]*\s*/g)||[t],q=[];let buf='';for(const s of parts){if((buf+s).length>200&&buf){q.push(buf);buf=s}else buf+=s}if(buf)q.push(buf);
  speaking=true;$('tts').classList.add('on');const stop=()=>{speaking=false;$('tts').classList.remove('on')};
  q.slice(0,200).forEach((x,i,a)=>{const u=new SpeechSynthesisUtterance(x);u.onerror=stop;if(i===a.length-1)u.onend=stop;speechSynthesis.speak(u)})};
$('bm').onclick=()=>{const d=docs[cur];if(!d)return;const m=$('main'),b=ls.get('bm:'+d.name,[]);
  b.push(d.kind==='pdf'?{pg:d.page,label:'Page '+d.page}:{top:m.scrollTop/Math.max(1,m.scrollHeight-m.clientHeight),label:Math.round(100*m.scrollTop/Math.max(1,m.scrollHeight-m.clientHeight))+'% through'});
  ls.set('bm:'+d.name,b);toast('Bookmarked ★');if(ptab==='out')drawOutline()};
$('pp').onclick=()=>jump(docs[cur].page-1);$('np').onclick=()=>jump(docs[cur].page+1);$('pn').onchange=e=>jump(+e.target.value);
$('zi').onclick=()=>zoomBy(1.2);$('zo').onclick=()=>zoomBy(1/1.2);
$('fw').onclick=()=>{const d=docs[cur];if(!d||!d.bw)return;d.fit=!d.fit;d.zoom=1;$('zl').textContent='100%';$('fw').classList.toggle('on',d.fit);d.sc0=pdfSc0(d);sizePages(d);observePages(d);jump(d.page,true)};
$('zl').onclick=()=>setZoom(1);
/* pinch / ctrl+wheel / double-tap zoom the document only (page-level zoom is disabled) */
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);let pz=null,tap={t:0,x:0,y:0,sx:0,sy:0,moved:false};
const rel=(x,y)=>{const r=$('main').getBoundingClientRect();return[x-r.left,y-r.top]};
$('main').addEventListener('touchstart',e=>{if(e.touches.length===2&&docs[cur]){pz={d:dist(e.touches),z:docs[cur].zoom};tap.moved=true}
  else if(e.touches.length===1){tap.sx=e.touches[0].clientX;tap.sy=e.touches[0].clientY;tap.moved=false}},{passive:true});
$('main').addEventListener('touchmove',e=>{if(e.touches.length===1&&Math.hypot(e.touches[0].clientX-tap.sx,e.touches[0].clientY-tap.sy)>10)tap.moved=true;
  if(pz&&e.touches.length===2){e.preventDefault();const[cx,cy]=rel((e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2);setZoom(pz.z*dist(e.touches)/pz.d,cx,cy)}},{passive:false});
$('main').addEventListener('touchend',e=>{if(e.touches.length<2)pz=null;
  if(e.touches.length===0&&!tap.moved&&e.changedTouches.length===1&&docs[cur]){const c=e.changedTouches[0],n=Date.now();
    if(n-tap.t<320&&Math.hypot(c.clientX-tap.x,c.clientY-tap.y)<30){const[cx,cy]=rel(c.clientX,c.clientY);setZoom(docs[cur].zoom>1.05?1:2,cx,cy);tap.t=0}else{tap.t=n;tap.x=c.clientX;tap.y=c.clientY}}});
document.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();const r=$('main').getBoundingClientRect(),inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
  const f=Math.max(.8,Math.min(1.25,Math.exp(-e.deltaY*(e.deltaMode===1?.05:.01))));zoomBy(f,inside?e.clientX-r.left:undefined,inside?e.clientY-r.top:undefined)},{passive:false});
let rzt;new ResizeObserver(()=>{clearTimeout(rzt);rzt=setTimeout(()=>{const d=docs[cur];if(!d)return;if(d.kind==='pdf'&&d.bw&&d.fit){d.sc0=pdfSc0(d);sizePages(d);observePages(d)}else if(d.kind==='img')applyImg(d)},150)}).observe($('main'));
document.addEventListener('gesturestart',e=>e.preventDefault());
let sv,raf=0;$('main').addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const mm=$('main'),d=docs[cur];$('prog').style.width=(100*mm.scrollTop/Math.max(1,mm.scrollHeight-mm.clientHeight))+'%';if(!d)return;
  if(d.kind==='pdf'){const cs=$('view').children,top=mm.scrollTop+80;let lo=0,hi=cs.length-1;while(lo<hi){const mid=(lo+hi+1)>>1;if(cs[mid].offsetTop<=top)lo=mid;else hi=mid-1}if(cs[lo]){d.page=+cs[lo].dataset.p;$('pn').value=d.page}}
  clearTimeout(sv);sv=setTimeout(()=>ls.set('pos:'+d.name,d.kind==='pdf'?{pg:d.page}:{top:mm.scrollTop/Math.max(1,mm.scrollHeight-mm.clientHeight)}),400)})},{passive:true});
/* command palette (inspired by 21st.dev Command Palette) */
const fz=(q,t)=>{q=q.toLowerCase();t=t.toLowerCase();const k=t.indexOf(q);if(k>=0)return 100-k;let i=0;for(const ch of t)if(ch===q[i])i++;return i===q.length?10:-1};
let cmdI=0,cmdList=[];
function allCmds(){const d=docs[cur];const c=[{t:'Open files…',k:'O',f:()=>$('file').click()},{t:'Toggle sidebar',k:'S',f:()=>$('sb').click()},{t:'Search in document',k:'/',f:()=>$('q').focus()},{t:'Switch theme',f:()=>$('theme').click()},{t:'Toggle fullscreen',k:'F',f:()=>$('fs').click()},{t:'Bookmark this spot',k:'B',f:()=>$('bm').click()},{t:'Read aloud',f:()=>$('tts').click()},{t:'Copy text',f:()=>$('cp').click()},{t:'Print',f:()=>$('pr').click()},{t:'Zoom in',k:'Ctrl +',f:()=>zoomBy(1.2)},{t:'Zoom out',k:'Ctrl −',f:()=>zoomBy(1/1.2)},{t:'Reset zoom',k:'Ctrl 0',f:()=>setZoom(1)}];
  if(d&&d.kind==='pdf')c.push({t:'Fit page width',f:()=>$('fw').click()},{t:'Night pages',f:()=>$('inv').click()},{t:'First page',f:()=>jump(1)},{t:'Last page',f:()=>jump(d.pdf.numPages)});
  docs.forEach((x,i)=>{if(i!==cur)c.push({t:'Switch to '+x.name,f:()=>show(i)})});return c}
function renderCmd(){const q=$('ci').value.trim();let L=allCmds();
  if(/^\d+$/.test(q)&&docs[cur]&&docs[cur].kind==='pdf')L=[{t:'Go to page '+q,f:()=>jump(+q)}].concat(L);
  else if(q)L=L.map(c=>({c,s:fz(q,c.t)})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s).map(x=>x.c);
  cmdList=L.slice(0,9);cmdI=Math.min(cmdI,Math.max(0,cmdList.length-1));
  $('cl').innerHTML=cmdList.length?cmdList.map((c,i)=>`<div class="cr${i===cmdI?' on':''}" data-i="${i}"><span>${esc(c.t)}</span>${c.k?'<kbd>'+esc(c.k)+'</kbd>':''}</div>`).join(''):'<div class="empty">No matching commands</div>';
  $('cl').querySelectorAll('.cr').forEach(e=>{e.onclick=()=>runCmd(+e.dataset.i);e.onmousemove=()=>{cmdI=+e.dataset.i;$('cl').querySelectorAll('.cr').forEach((x,j)=>x.classList.toggle('on',j===cmdI))}})}
function openCmd(){$('cmd').hidden=false;$('ci').value='';cmdI=0;renderCmd();$('ci').focus()}
function closeCmd(){$('cmd').hidden=true}
function runCmd(i){const c=cmdList[i];closeCmd();c&&setTimeout(c.f,0)}
$('kbtn').onclick=openCmd;$('cmd').onclick=e=>{if(e.target===$('cmd'))closeCmd()};
$('ci').oninput=()=>{cmdI=0;renderCmd()};
$('ci').onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();cmdI=Math.min(cmdList.length-1,cmdI+1);renderCmd()}else if(e.key==='ArrowUp'){e.preventDefault();cmdI=Math.max(0,cmdI-1);renderCmd()}else if(e.key==='Enter')runCmd(cmdI);else if(e.key==='Escape')closeCmd()};
window.onBack=()=>{if(!$('cmd').hidden){closeCmd();return true}if(innerWidth<=760&&!$('side').classList.contains('hide')){$('side').classList.add('hide');return true}if($('q').value){$('q').value='';search();return true}return false};
document.addEventListener('keydown',e=>{const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='k'){e.preventDefault();$('cmd').hidden?openCmd():closeCmd();return}
  if(mod&&['+','=','-','_','0'].includes(e.key)){e.preventDefault();e.key==='0'?setZoom(1):zoomBy(/[-_]/.test(e.key)?1/1.15:1.15);return}
  if(!$('cmd').hidden||/INPUT/.test(e.target.tagName)||mod)return;
  if(k==='/'){e.preventDefault();$('q').focus()}else if(k==='s')$('sb').click();else if(k==='f')$('fs').click();else if(k==='b')$('bm').click();else if(k==='o')$('file').click();
  else if(k==='n'||k==='arrowright'){docs[cur]&&docs[cur].kind==='pdf'&&jump(docs[cur].page+1)}else if(k==='p'||k==='arrowleft'){docs[cur]&&docs[cur].kind==='pdf'&&jump(docs[cur].page-1)}});
['dragover','dragenter'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();document.body.classList.add('over')}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();document.body.classList.remove('over')}));
document.addEventListener('drop',e=>{[...e.dataTransfer.files].forEach(f=>load(f))});
if(innerWidth<760)$('side').classList.add('hide');
window.openShared=async(name,mime,path)=>{try{const m={'application/pdf':'pdf','text/plain':'txt','text/markdown':'md','text/csv':'csv','application/json':'json','text/html':'html','application/vnd.openxmlformats-officedocument.wordprocessingml.document':'docx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'xlsx','application/vnd.ms-excel':'xls'};
 if(!/\.[a-z0-9]{2,5}$/i.test(name)&&m[mime])name+='.'+m[mime];
 document.getElementById('splash')?.click();const r=await fetch('/shared/'+(path||'f'),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);await load(new File([await r.blob()],name,{type:mime}))}catch(e){toast('Couldn’t open shared file: '+(e.message||e))}};
drawPanel();
</script>
